<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Detailing - Easy Edit Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .card-anim { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        textarea { resize: vertical; min-height: 100px; transition: all 0.3s border; }
        textarea:focus { border-color: #6366f1 !important; background-color: #fff !important; }
        .break-words { overflow-wrap: break-word; word-wrap: break-word; }
        .text-justify { text-align: justify; text-justify: inter-word; }
    </style>
</head>
<body class="pb-20">

    <!-- হেডার -->
    <div class="bg-indigo-900 text-white px-4 py-8 rounded-b-[2.5rem] shadow-xl mb-4">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <button onclick="history.back()" class="text-indigo-300 font-bold text-[10px] uppercase mb-1 block">← Back</button>
                <h1 class="text-xl font-black italic tracking-tight leading-none">Detailing Note</h1>
                <p id="cacheStatus" class="text-[7px] text-indigo-400 font-bold uppercase tracking-[0.2em] mt-1">Local Memory Mode</p>
            </div>
            <div class="flex gap-2">
                <button onclick="syncFromCloud()" class="bg-indigo-800 w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-lg active:scale-95 transition">🔄</button>
                <button onclick="openModal()" class="bg-indigo-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-lg active:scale-95 transition">➕</button>
            </div>
        </div>
    </div>

    <main class="px-3 max-w-lg mx-auto">
        <!-- সার্চ বক্স -->
        <div class="relative mb-4">
            <input type="text" id="searchInput" oninput="filterSpeech()" placeholder="ওষুধ বা স্পিচ খুঁজুন..." 
                class="w-full bg-white border-none rounded-xl py-3 pl-10 pr-4 shadow-sm outline-none focus:ring-2 ring-indigo-500/20 text-sm font-medium">
            <span class="absolute left-3.5 top-3 opacity-30 text-base">🔍</span>
        </div>

        <!-- স্পিচ লিস্ট -->
        <div id="speechList" class="space-y-4">
            <div class="p-20 text-center text-gray-300 italic text-xs font-bold">সিঙ্ক হচ্ছে...</div>
        </div>
    </main>

    <!-- ইনপুট/এডিট মোডাল (বক্সগুলো বড় করা হয়েছে) -->
    <div id="speechModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-2">
        <div class="bg-white w-full max-w-lg rounded-[2rem] p-6 shadow-2xl card-anim overflow-y-auto max-h-[95vh]">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <h2 id="modalTitle" class="text-xl font-black text-indigo-900">নতুন ডিটেইলিং</h2>
                <button onclick="closeModal()" class="text-gray-400 text-3xl font-light">&times;</button>
            </div>

            <form id="speechForm" class="space-y-6">
                <input type="hidden" id="speechId">
                
                <!-- ব্র্যান্ড নাম -->
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">ব্র্যান্ড নাম</label>
                    <input type="text" id="medName" placeholder="উদা: Arnis" required class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-4 outline-none focus:border-indigo-500 text-base font-black">
                </div>

                <!-- মেইন স্পিচ বক্স (আরও বড় করা হয়েছে) -->
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Detailing Speech (Pitch)</label>
                    <textarea id="medSpeech" placeholder="সালাম দিয়ে শুরু করুন এবং বিস্তারিত লিখুন..." required 
                        class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 mt-1 outline-none text-base h-60 leading-relaxed font-medium"></textarea>
                </div>

                <!-- পয়েন্ট সেকশন -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Key Highlights (Step-by-Step)</label>
                        <button type="button" onclick="addPointField()" class="text-[10px] bg-indigo-100 text-indigo-600 px-4 py-1.5 rounded-full font-black uppercase tracking-tighter">+ পয়েন্ট যোগ</button>
                    </div>
                    <div id="pointsContainer" class="space-y-4">
                        <!-- ডায়নামিক পয়েন্ট এখানে আসবে -->
                    </div>
                </div>

                <!-- বাটনসমূহ -->
                <div class="flex gap-3 pt-4 border-t sticky bottom-0 bg-white pb-2">
                    <button type="button" onclick="deleteSpeech()" id="delBtn" class="hidden flex-1 bg-rose-50 text-rose-500 py-4 rounded-2xl font-bold text-xs uppercase border border-rose-100 active:scale-95 transition">মুছুন</button>
                    <button type="submit" id="saveBtn" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold text-xs uppercase shadow-lg shadow-indigo-200 active:scale-95 transition">সেভ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('mso');
        const colRef = collection(db, "detailing_pitches");
        let allSpeeches = [];

        async function init() {
            const cachedData = localStorage.getItem('detailing_pitches_cache');
            if (cachedData) {
                allSpeeches = JSON.parse(cachedData);
                document.getElementById('cacheStatus').innerText = "Offline Mode";
                renderList(allSpeeches);
            } else { await syncFromCloud(); }
        }

        window.syncFromCloud = async () => {
            const status = document.getElementById('cacheStatus');
            status.innerText = "Syncing...";
            try {
                const q = query(colRef, orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                allSpeeches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                localStorage.setItem('detailing_pitches_cache', JSON.stringify(allSpeeches));
                renderList(allSpeeches);
                status.innerText = "Updated";
            } catch (e) { status.innerText = "Sync Failed!"; }
        };

        function renderList(list) {
            const container = document.getElementById('speechList');
            if (list.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-10 italic text-xs">কোনো তথ্য নেই</p>`;
                return;
            }
            container.innerHTML = list.map(s => `
                <div onclick="openEditor('${s.id}')" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-50 hover:border-indigo-200 transition cursor-pointer break-words card-anim">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-black text-slate-800 leading-none">${s.brandName}</h3>
                        <span class="text-[9px] font-black text-indigo-500 uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full">Edit Detail</span>
                    </div>
                    
                    <div class="mb-5">
                        <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-100">
                            <p class="text-[15px] text-slate-700 font-medium leading-[1.7] text-justify italic">
                                "${s.speech}"
                            </p>
                        </div>
                    </div>

                    <div class="space-y-4 mt-5 border-t pt-5">
                        ${s.highlights ? s.highlights.map((h, idx) => `
                            <div class="flex gap-4">
                                <div class="flex-shrink-0 w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-[10px] font-black mt-1 shadow-md shadow-indigo-100">${idx+1}</div>
                                <div class="flex-1">
                                    <h4 class="text-[14px] font-black text-slate-800 uppercase tracking-tight leading-tight mb-1">${h.title}</h4>
                                    <p class="text-[12px] text-slate-500 font-medium leading-relaxed text-justify">${h.desc}</p>
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                </div>
            `).join('');
        }

        // পয়েন্ট ইনপুট বক্স বড় করা হয়েছে (h-32)
        window.addPointField = (title = "", desc = "") => {
            const container = document.getElementById('pointsContainer');
            const div = document.createElement('div');
            div.className = "point-card p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 space-y-3 relative card-anim";
            div.innerHTML = `
                <div class="absolute -left-3 top-1/2 -translate-y-1/2 flex flex-col gap-1.5 z-10">
                    <button type="button" onclick="movePoint(this, 'up')" class="w-7 h-7 bg-white border rounded-full shadow-md text-indigo-600 flex items-center justify-center text-xs font-bold">🔼</button>
                    <button type="button" onclick="movePoint(this, 'down')" class="w-7 h-7 bg-white border rounded-full shadow-md text-indigo-600 flex items-center justify-center text-xs font-bold">🔽</button>
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">Highlight Title</label>
                    <input type="text" value="${title}" placeholder="পয়েন্ট শিরোনাম" class="point-title w-full bg-white border border-slate-200 rounded-xl p-3 outline-none text-xs font-black uppercase tracking-tight focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">Explanation (Description)</label>
                    <textarea placeholder="বিস্তারিত বর্ণনা এখানে লিখুন..." class="point-desc w-full bg-white border border-slate-200 rounded-xl p-3 outline-none text-sm font-medium h-32 leading-relaxed focus:border-indigo-500">${desc}</textarea>
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-white text-rose-500 w-7 h-7 rounded-full shadow-md flex items-center justify-center border border-rose-100 text-xl font-light">&times;</button>
            `;
            container.appendChild(div);
        };

        window.movePoint = (btn, direction) => {
            const card = btn.closest('.point-card');
            if (direction === 'up') {
                const prev = card.previousElementSibling;
                if (prev) card.parentElement.insertBefore(card, prev);
            } else {
                const next = card.nextElementSibling;
                if (next) card.parentElement.insertBefore(next, card);
            }
        };

        window.openModal = () => {
            document.getElementById('speechModal').classList.remove('hidden');
            document.getElementById('speechForm').reset();
            document.getElementById('pointsContainer').innerHTML = "";
            addPointField(); 
            document.getElementById('speechId').value = "";
            document.getElementById('modalTitle').innerText = "নতুন ডিটেইলিং";
            document.getElementById('delBtn').classList.add('hidden');
        };

        window.closeModal = () => document.getElementById('speechModal').classList.add('hidden');

        window.openEditor = (id) => {
            const s = allSpeeches.find(item => item.id === id);
            document.getElementById('speechId').value = s.id;
            document.getElementById('medName').value = s.brandName;
            document.getElementById('medSpeech').value = s.speech;
            const container = document.getElementById('pointsContainer');
            container.innerHTML = "";
            if(s.highlights) s.highlights.forEach(h => addPointField(h.title, h.desc));
            else addPointField();
            document.getElementById('modalTitle').innerText = "এডিট ডিটেইলিং";
            document.getElementById('delBtn').classList.remove('hidden');
            document.getElementById('speechModal').classList.remove('hidden');
        };

        document.getElementById('speechForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('speechId').value;
            const btn = document.getElementById('saveBtn');
            const highlights = Array.from(document.querySelectorAll('.point-card')).map(card => ({
                title: card.querySelector('.point-title').value.trim(),
                desc: card.querySelector('.point-desc').value.trim()
            })).filter(h => h.title || h.desc);

            const data = {
                brandName: document.getElementById('medName').value,
                speech: document.getElementById('medSpeech').value,
                highlights: highlights,
                timestamp: new Date()
            };

            btn.innerText = "..."; btn.disabled = true;
            try {
                if (id) await updateDoc(doc(db, "detailing_pitches", id), data);
                else await addDoc(colRef, data);
                closeModal();
                await syncFromCloud();
            } catch (err) { alert("Error!"); }
            finally { btn.innerText = "সেভ করুন"; btn.disabled = false; }
        });

        window.deleteSpeech = async () => {
            const id = document.getElementById('speechId').value;
            if (confirm("এটি কি পুরোপুরি মুছে ফেলবেন?")) {
                try {
                    await deleteDoc(doc(db, "detailing_pitches", id));
                    closeModal();
                    await syncFromCloud();
                } catch (e) { alert("Error!"); }
            }
        };

        window.filterSpeech = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderList(allSpeeches.filter(s => s.brandName.toLowerCase().includes(term) || s.speech.toLowerCase().includes(term)));
        };

        init();
    </script>
</body>
</html>
