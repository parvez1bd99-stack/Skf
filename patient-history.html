<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রোগীর তালিকা - SmartConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50">

    <header class="bg-white border-b sticky top-0 z-50 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-slate-400">←</button>
            <h1 class="font-black text-slate-800 uppercase text-sm tracking-tight">রোগীর রেকর্ড</h1>
        </div>
        <div id="resultCount" class="text-[10px] font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full uppercase">০ জন</div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- ফিল্টার সেকশন -->
        <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-100 mb-6 space-y-4">
            <!-- নাম দিয়ে সার্চ -->
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">রোগীর নাম/মোবাইল</label>
                <input type="text" id="searchInput" oninput="filterResults()" placeholder="সার্চ করুন..." class="w-full bg-slate-50 p-3 rounded-xl text-sm font-bold outline-none border-none mt-1">
            </div>
            
            <!-- তারিখ দিয়ে ফিল্টার -->
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">তারিখ নির্বাচন</label>
                <input type="date" id="dateFilter" onchange="loadRecords()" class="w-full bg-slate-50 p-3 rounded-xl text-sm font-bold outline-none border-none mt-1">
            </div>
        </div>

        <!-- রেজাল্ট লিস্ট -->
        <div id="historyList" class="space-y-3">
            <div class="text-center py-20 text-slate-300 italic text-sm">রেকর্ড লোড হচ্ছে...</div>
        </div>
    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('docId');
        let allRecords = [];

        async function loadRecords() {
            if(!docId) return;
            const listArea = document.getElementById('historyList');
            const selectedDate = document.getElementById('dateFilter').value; // YYYY-MM-DD
            
            listArea.innerHTML = '<div class="text-center py-10 italic text-slate-400">খুঁজছি...</div>';
            
            try {
                const q = query(collection(db, "prescriptions"), 
                    where("doctorId", "==", docId),
                    orderBy("timestamp", "desc")
                );
                
                const snap = await getDocs(q);
                allRecords = [];
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const presDate = data.timestamp?.toDate().toLocaleDateString('en-CA');
                    
                    // তারিখ ফিল্টার থাকলে চেক করবে
                    if(selectedDate && presDate !== selectedDate) return;
                    
                    allRecords.push({ id: doc.id, ...data, presDateFormatted: data.timestamp?.toDate().toLocaleDateString('bn-BD') });
                });

                renderList(allRecords);
            } catch (e) { console.error(e); }
        }

        function renderList(records) {
            const listArea = document.getElementById('historyList');
            document.getElementById('resultCount').innerText = records.length + " জন";

            if(records.length === 0) {
                listArea.innerHTML = '<div class="bg-white p-10 rounded-[2rem] text-center text-slate-400 text-xs italic">কোনো রেকর্ড পাওয়া যায়নি!</div>';
                return;
            }

            listArea.innerHTML = records.map(r => `
                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center">
                    <div>
                        <h4 class="text-sm font-black text-slate-800">${r.patientName}</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase">${r.presDateFormatted} | ${r.medicines?.length || 0}টি ওষুধ</p>
                    </div>
                    <button onclick="viewPrescription('${r.id}')" class="bg-blue-50 text-blue-600 p-3 rounded-2xl text-[10px] font-black uppercase">বিস্তারিত</button>
                </div>
            `).join('');
        }

        window.filterResults = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRecords.filter(r => 
                r.patientName.toLowerCase().includes(term) || 
                (r.patientPhone && r.patientPhone.includes(term))
            );
            renderList(filtered);
        };

        window.viewPrescription = (id) => {
            // প্রেসক্রিপশন ডিটেইল দেখার জন্য নতুন পেজ বা মোডাল ওপেন করা যায়
            alert("প্রেসক্রিপশন আইডি: " + id + "\nডিটেইল দেখার ফিচারটি যুক্ত করা হচ্ছে।");
        };

        // আজকের ডেট সেট করা ডিফল্টভাবে
        document.getElementById('dateFilter').value = new Date().toLocaleDateString('en-CA');
        loadRecords();
    </script>
</body>
</html>
