
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রো ড্যাশবোর্ড - SmartConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .action-card { transition: all 0.2s; border: 1px solid transparent; }
        .action-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="pb-10">

    <!-- প্রিমিয়াম হেডার -->
    <div class="bg-slate-900 text-white pt-12 pb-20 px-6 rounded-b-[3.5rem] shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full -mr-16 -mt-16"></div>
        <div class="max-w-md mx-auto relative">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-black italic text-blue-400 tracking-tighter">SmartConnect <span class="text-white not-italic">Rx</span></h1>
                    <p class="text-[9px] uppercase font-bold tracking-[0.3em] text-slate-400">Digital Ecosystem</p>
                </div>
                <button onclick="logout()" class="p-2 bg-white/5 rounded-xl border border-white/10 text-[10px] font-bold uppercase">Logout</button>
            </div>

            <div class="flex items-center gap-5">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center text-3xl shadow-xl shadow-blue-900/20 ring-4 ring-white/5">👨‍⚕️</div>
                <div>
                    <h2 id="docName" class="text-xl font-black leading-none">ডাক্তারের নাম...</h2>
                    <p id="docDegree" class="text-[10px] text-slate-400 mt-2 font-bold uppercase tracking-wider">এমবিবিএস | বিসিএস</p>
                </div>
            </div>
        </div>
    </div>

    <main class="px-5 max-w-md mx-auto -mt-10 relative z-10">
        <!-- কুইক স্ট্যাটস -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-white">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">আজকের রোগী</p>
                <div class="flex items-baseline gap-1">
                    <h3 id="todayCount" class="text-3xl font-black text-slate-800">০</h3>
                    <span class="text-[10px] font-bold text-slate-400">জন</span>
                </div>
            </div>
            <div class="bg-white p-5 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-white">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">মোট প্রেসক্রিপশন</p>
                <div class="flex items-baseline gap-1">
                    <h3 id="totalPres" class="text-3xl font-black text-blue-600">০</h3>
                    <span class="text-[10px] font-bold text-blue-300">টি</span>
                </div>
            </div>
        </div>

        <!-- মেইন অ্যাকশন বক্স -->
        <div class="space-y-4">
            <!-- প্রেসক্রিপশন লিখুন -->
            <a id="writePresLink" href="#" class="action-card bg-blue-600 p-6 rounded-[2.5rem] flex items-center justify-between shadow-xl shadow-blue-200 group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl group-hover:rotate-12 transition">📝</div>
                    <div>
                        <h4 class="text-white font-black text-sm uppercase">প্রেসক্রিপশন লিখুন</h4>
                        <p class="text-blue-100 text-[9px] font-bold uppercase">নতুন রোগী দেখুন</p>
                    </div>
                </div>
                <div class="text-white/50 text-xl mr-2">→</div>
            </a>

            <div class="grid grid-cols-2 gap-4">
                <!-- রোগীর ইতিহাস (নতুন পেজ লিংক) -->
                <a id="historyLink" href="#" class="action-card bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col items-center text-center gap-3">
                    <span class="text-3xl">👥</span>
                    <div>
                        <h4 class="text-slate-800 font-black text-[10px] uppercase">রোগীর তালিকা</h4>
                        <p class="text-[8px] text-slate-400 font-bold uppercase">সার্চ ও রেকর্ড</p>
                    </div>
                </a>

                <!-- মেডিসিন গাইড -->
                <a href="medicine-guide.html" class="action-card bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col items-center text-center gap-3">
                    <span class="text-3xl">💊</span>
                    <div>
                        <h4 class="text-slate-800 font-black text-[10px] uppercase">মেডিসিন গাইড</h4>
                        <p class="text-[8px] text-slate-400 font-bold uppercase">SK+F ইনডেক্স</p>
                    </div>
                </a>
            </div>

            <!-- সেটিংস বা প্রোফাইল -->
            <button onclick="alert('শীঘ্রই আসছে')" class="w-full bg-slate-100 p-4 rounded-2xl text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                ⚙️ প্রোফাইল ও সেটিংস
            </button>
        </div>

        <p class="text-center text-[10px] text-slate-300 font-bold uppercase tracking-widest mt-12 mb-6">SmartConnect v3.0 • Secure Digital Rx</p>
    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        async function init() {
            if (!docId) { window.location.href = 'index.html'; return; }

            // ১. ডক্টর ডাটা
            const dSnap = await getDoc(doc(db, "doctors", docId));
            if(dSnap.exists()) {
                const d = dSnap.data();
                document.getElementById('docName').innerText = d.name;
                document.getElementById('docDegree').innerText = d.degree || "বিশেষজ্ঞ চিকিৎসক";
                document.getElementById('writePresLink').href = `doctor-pad.html?docId=${docId}`;
                document.getElementById('historyLink').href = `patient-history.html?docId=${docId}`;
            }

            // ২. আজকের প্রেসক্রিপশন কাউন্ট
            const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
            const qToday = query(collection(db, "prescriptions"), 
                where("doctorId", "==", docId)
            );
            
            const snap = await getDocs(qToday);
            let countToday = 0;
            snap.forEach(doc => {
                const date = doc.data().timestamp?.toDate().toLocaleDateString('en-CA');
                if(date === todayStr) countToday++;
            });
            document.getElementById('todayCount').innerText = countToday;
            document.getElementById('totalPres').innerText = snap.size;
        }

        window.logout = () => { localStorage.clear(); location.href='index.html'; };
        init();
    </script>
</body>
</html>
