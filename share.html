<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার স্টক এনালাইজার - BD Market</title>
    <!-- Bootstrap CSS for Responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .stock-card { border-radius: 15px; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; }
        .stock-card:hover { transform: translateY(-5px); }
        .buy-signal { color: #28a745; font-weight: bold; }
        .sell-signal { color: #dc3545; font-weight: bold; }
        .live-indicator { height: 10px; width: 10px; background-color: #ff0000; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
        <h3 class="text-dark">BD Stock Watch <span class="live-indicator"></span></h3>
        <button class="btn btn-primary btn-sm" onclick="fetchData()">রিফ্রেশ ডাটা</button>
    </header>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card p-3 stock-card text-center">
                <h6>DSEX Index</h6>
                <h4 id="dsex-val">6,250.50</h4>
                <small class="text-success">+0.45%</small>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card p-3 stock-card text-center">
                <h6>Portfolio Value</h6>
                <h4 id="port-val">৳ 5,40,000</h4>
            </div>
        </div>
    </div>

    <!-- Stock Table / List -->
    <div class="card stock-card p-3">
        <h5 class="mb-3">আমার ওয়াচলিস্ট (Live)</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>শেয়ার কোড</th>
                        <th>বর্তমান মূল্য</th>
                        <th>পরিবর্তন</th>
                        <th>সিদ্ধান্ত (AI)</th>
                    </tr>
                </thead>
                <tbody id="stock-list">
                    <!-- Data will be inserted here by JS -->
                    <tr>
                        <td><strong>GP</strong></td>
                        <td>261.50</td>
                        <td class="text-success">+1.2%</td>
                        <td><span class="buy-signal">HOLD</span></td>
                    </tr>
                    <tr>
                        <td><strong>BATBC</strong></td>
                        <td>518.70</td>
                        <td class="text-danger">-0.5%</td>
                        <td><span class="sell-signal">SELL</span></td>
                    </tr>
                    <tr>
                        <td><strong>SQUAREPHARMA</strong></td>
                        <td>209.80</td>
                        <td class="text-success">+2.1%</td>
                        <td><span class="buy-signal">BUY</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // এই ফাংশনটি ডাটা ফেচ করার জন্য ব্যবহৃত হবে
    async function fetchData() {
        console.log("Updating Data...");
        // এখানে আপনি আপনার API কল করবেন
        // উদাহরনস্বরূপ: fetch('your-api-url').then(res => res.json()).then(data => ...)
        alert("লাইভ ডাটা আপডেট হচ্ছে (ডেমো)...");
    }

    // প্রতি ১ মিনিটে ডাটা অটো আপডেট হবে
    setInterval(fetchData, 60000);
</script>

</body>
</html>
