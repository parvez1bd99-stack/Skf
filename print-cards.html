<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconic Smart Print - SK+F</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; }
        
        @page { size: A4; margin: 0; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            #printArea { 
                display: grid !important; 
                grid-template-columns: 1fr 1fr !important; 
                gap: 2mm !important; 
                padding: 10mm !important;
                width: 210mm !important;
                margin: 0 auto !important;
            }
            .smart-card { 
                border: 1px solid #1e3a8a !important; 
                break-inside: avoid !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact;
            }
        }

        .smart-card {
            width: 92mm; height: 54mm;
            border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid #1e3a8a; background: white;
            position: relative;
        }

        .card-header { background: #1e3a8a; color: white; padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-body { flex-grow: 1; display: flex; padding: 10px 15px; gap: 15px; align-items: center; background: #ffffff; }
        .qr-container { width: 32mm; height: 32mm; background: white; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .qr-container img { width: 100% !important; height: 100% !important; }
        
        .info-area { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
        .info-item { display: flex; items-start; gap: 6px; }
        .info-icon { font-size: 10px; flex-shrink: 0; margin-top: 2px; }

        .card-footer { background: #f8fafc; padding: 5px 15px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        #printArea { display: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-5xl mx-auto no-print">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-white">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 text-center md:text-left">
                <div>
                    <h1 class="text-3xl font-black text-slate-800 italic uppercase leading-none">SK+F Iconic Print</h1>
                    <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest mt-2 italic">ব্যাচ প্রিন্টিং ও পিডিএফ ম্যানেজমেন্ট</p>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <button onclick="generateAndPrint()" class="bg-blue-700 text-white px-10 py-4 rounded-2xl font-black shadow-xl hover:bg-blue-800 transition transform active:scale-95 text-xs uppercase tracking-widest">
                        📥 ডাউনলোড স্মার্ট পিডিএফ
                    </button>
                    <p id="selectionCount" class="text-[11px] font-black text-slate-400 uppercase">০ জন সিলেক্ট করা হয়েছে</p>
                </div>
            </div>

            <div class="relative mb-8">
                <span class="absolute left-5 top-4 opacity-40">🔍</span>
                <input type="text" id="searchInput" oninput="filterChemists()" placeholder="নাম, মালিক অথবা লোকেশন লিখে খুঁজুন..." 
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-3xl py-4 pl-14 pr-6 outline-none focus:border-blue-500 transition font-semibold text-slate-700 shadow-inner">
            </div>

            <div class="max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                <div id="selectionList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </div>

    <div id="printArea"></div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('mso');
        const SECRET_KEY = "APON-SECURE-V1";
        let allChemists = [];
        let selectedIds = new Set();

        async function loadChemists() {
            try {
                const q = query(collection(db, "users"), where("role", "==", "chemist"));
                const snap = await getDocs(q);
                allChemists = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allChemists.sort((a, b) => a.name.localeCompare(b.name));
                renderSelectionList();
            } catch (e) { console.log("Load Error"); }
        }

        function renderSelectionList() {
            const container = document.getElementById('selectionList');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChemists.filter(c => 
                c.name.toLowerCase().includes(term) || 
                (c.owner && c.owner.toLowerCase().includes(term)) ||
                (c.address && c.address.toLowerCase().includes(term))
            );

            container.innerHTML = filtered.map(c => `
                <label class="flex items-start gap-3 bg-white p-4 rounded-2xl border-2 ${selectedIds.has(c.id) ? 'border-blue-500 bg-blue-50' : 'border-slate-100'} cursor-pointer shadow-sm hover:border-blue-200 transition">
                    <input type="checkbox" onchange="toggleId('${c.id}')" ${selectedIds.has(c.id) ? 'checked' : ''} class="w-5 h-5 mt-1 rounded text-blue-600 focus:ring-0">
                    <div class="overflow-hidden flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-xs">🏪</span>
                            <p class="text-sm font-black text-slate-800 truncate">${c.name}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px]">👤</span>
                            <p class="text-[10px] text-blue-600 font-bold uppercase truncate">${c.owner || '---'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px]">📍</span>
                            <p class="text-[9px] text-gray-400 font-bold uppercase truncate">${c.address || 'Location Not Set'}</p>
                        </div>
                    </div>
                </label>
            `).join('');
            updateCounter();
        }

        window.toggleId = (id) => {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            renderSelectionList();
        };

        function updateCounter() {
            document.getElementById('selectionCount').innerText = `${selectedIds.size} জন সিলেক্ট করা হয়েছে`;
        }

        window.generateAndPrint = () => {
            if (selectedIds.size === 0) return alert("দয়া করে দোকানদার সিলেক্ট করুন!");
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = "";
            
            const selectedData = allChemists.filter(c => selectedIds.has(c.id));
            selectedData.forEach(c => {
                const card = document.createElement('div');
                card.className = "smart-card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="text-lg font-black italic tracking-tighter">SK+F</span>
                        <span class="text-[7px] font-bold uppercase tracking-widest border border-white/30 px-2 py-0.5 rounded-full">Digital Member</span>
                    </div>
                    <div class="card-body">
                        <div class="qr-container"><div id="qr-${c.id}"></div></div>
                        <div class="info-area">
                            <div class="info-item">
                                <span class="info-icon">🏪</span>
                                <h3 class="text-[14px] font-black text-slate-800 uppercase leading-tight">${c.name}</h3>
                            </div>
                            <div class="info-item">
                                <span class="info-icon">👤</span>
                                <p class="text-[10px] text-blue-600 font-bold leading-none">মালিক: ${c.owner || '---'}</p>
                            </div>
                            <div class="info-item mt-1">
                                <span class="info-icon">📍</span>
                                <p class="text-[8px] text-gray-500 font-bold leading-tight uppercase italic">${c.address || 'Not Set'}</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div>
                            <p class="text-[9px] font-black text-slate-800 leading-none">Parvez Musharof</p>
                            <p class="text-[6px] text-slate-400 font-bold uppercase tracking-tighter leading-none">Medical Promotion Officer</p>
                        </div>
                        <p class="text-[10px] font-black text-blue-700 tracking-tighter leading-none">📞 01407281473</p>
                    </div>
                `;
                printArea.appendChild(card);
                
                // এখানে কিউআর ডাটা ফরম্যাট আপডেট করা হয়েছে (KEY:ROLE:ID)
                const qrData = btoa(SECRET_KEY + ":chemist:" + c.id);
                
                new QRCode(document.getElementById(`qr-${c.id}`), { 
                    text: qrData, 
                    width: 110, 
                    height: 110, 
                    colorDark: "#000000", 
                    colorLight: "#ffffff", 
                    correctLevel: QRCode.CorrectLevel.H 
                });
            });
            setTimeout(() => { window.print(); }, 500);
        };

        window.filterChemists = () => renderSelectionList();
        loadChemists();
    </script>
</body>
</html>
