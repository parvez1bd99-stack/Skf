<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিন্ট প্রেসক্রিপশন - SmartConnect Rx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        
        /* প্রিন্ট সেটিংস */
        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            #mainPad { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important;
                margin: 0 !important;
            }
        }

        #mainPad {
            width: 210mm;
            min-height: 277mm;
            padding: 15mm;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .rx-symbol { font-size: 40px; font-family: serif; font-weight: bold; font-style: italic; margin-bottom: 10px; }
        .sidebar { width: 30%; border-right: 2px solid #f1f5f9; padding-right: 15px; }
        .main-content { flex: 1; padding-left: 25px; }
    </style>
</head>
<body>

    <!-- কন্ট্রোল বার (প্রিন্ট করার জন্য) -->
    <div class="no-print bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="bg-white/10 px-4 py-2 rounded-lg text-sm">⬅ ফিরে যান</button>
            <h1 class="text-sm font-bold uppercase tracking-widest text-blue-400">Prescription Preview</h1>
        </div>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded-xl font-black uppercase text-xs shadow-lg transition-all">🖨️ প্রিন্ট করুন (A4)</button>
    </div>

    <!-- মেইন প্রেসক্রিপশন প্যাড -->
    <div id="mainPad">
        <!-- প্যাড হেডার (ডাক্তারের তথ্য) -->
        <div class="flex justify-between items-end border-b-4 border-slate-900 pb-5 mb-6">
            <div>
                <h1 id="docName" class="text-3xl font-black text-slate-900 leading-none">ডাক্তারের নাম লোড হচ্ছে...</h1>
                <p id="docDegree" class="text-sm font-bold text-blue-600 mt-2 uppercase tracking-wide"></p>
                <p id="docChamber" class="text-[10px] font-bold text-slate-400 mt-1 uppercase italic"></p>
            </div>
            <div class="text-right">
                <h2 class="text-2xl font-black italic text-slate-800">SK+F</h2>
                <p class="text-[9px] font-bold text-blue-500 uppercase tracking-[.2em] mt-1">SmartConnect Rx</p>
            </div>
        </div>

        <!-- রোগীর তথ্য বার -->
        <div class="grid grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl mb-8 text-[11px] font-bold border border-slate-100">
            <p>নাম: <span id="pName" class="text-slate-900">---</span></p>
            <p>বয়স: <span id="pAge" class="text-slate-900">---</span></p>
            <p>লিঙ্গ: <span id="pGender" class="text-slate-900">---</span></p>
            <p>তারিখ: <span id="pDate" class="text-slate-900">--/--/--</span></p>
        </div>

        <!-- বডি সেকশন -->
        <div class="flex flex-1">
            <!-- বাম দিক (ভাইটাল ও টেস্ট) -->
            <div class="sidebar space-y-8">
                <div>
                    <h4 class="text-[9px] font-black text-slate-400 uppercase mb-3 border-b pb-1">লক্ষণ ও ভাইটাল</h4>
                    <div id="pVitals" class="text-xs font-bold space-y-1 text-slate-700">
                        <!-- ভাইটাল লোড হবে -->
                    </div>
                </div>
                <div>
                    <h4 class="text-[9px] font-black text-slate-400 uppercase mb-3 border-b pb-1">প্রয়োজনীয় টেস্ট</h4>
                    <div id="pTests" class="text-xs font-bold text-blue-600 space-y-1">
                        <!-- টেস্ট লোড হবে -->
                    </div>
                </div>
            </div>

            <!-- ডান দিক (ওষুধ) -->
            <div class="main-content">
                <div class="rx-symbol text-slate-900">Rx.</div>
                <div id="pMedicines" class="space-y-6">
                    <!-- ওষুধ লোড হবে -->
                </div>

                <div class="mt-16 border-t border-dashed border-slate-200 pt-6">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-2">উপদেশ / Advice</h4>
                    <div id="pAdvice" class="text-[13px] font-bold italic text-slate-700 leading-relaxed whitespace-pre-line">
                        <!-- উপদেশ লোড হবে -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ফুটার -->
        <footer class="mt-10 border-t pt-4 flex justify-between items-center text-slate-400">
            <p class="text-[9px] font-bold">Powered by SK+F Digital Health Ecosystem</p>
            <div class="text-center">
                <div class="w-32 border-b-2 border-slate-200 mb-1"></div>
                <p class="text-[9px] font-black text-slate-800">চিকিৎসকের স্বাক্ষর</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('patientId');
        const docId = urlParams.get('docId');

        async function loadPrescription() {
            if (!patientId || !docId) return alert("তথ্য পাওয়া যায়নি!");

            try {
                // ১. ডাক্তারের তথ্য লোড করা (হেডারের জন্য)
                const dSnap = await getDoc(doc(db, "doctors", docId));
                if(dSnap.exists()) {
                    const d = dSnap.data();
                    document.getElementById('docName').innerText = d.name;
                    document.getElementById('docDegree').innerText = d.degree || "";
                    document.getElementById('docChamber').innerText = d.chamber || "";
                }

                // ২. সর্বশেষ প্রেসক্রিপশন লোড করা
                const q = query(
                    collection(db, "prescriptions"), 
                    where("patientId", "==", patientId),
                    where("doctorId", "==", docId),
                    orderBy("timestamp", "desc"),
                    limit(1)
                );
                
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    alert("কোনো প্রেসক্রিপশন পাওয়া যায়নি!");
                    return;
                }

                const rx = querySnapshot.docs[0].data();

                // ৩. UI-তে ডাটা বসানো
                document.getElementById('pName').innerText = rx.patientName;
                document.getElementById('pAge').innerText = rx.age || "---"; // যদি আগের পাতায় বয়স না থাকে
                document.getElementById('pGender').innerText = rx.gender || "---";
                document.getElementById('pDate').innerText = rx.timestamp?.toDate().toLocaleDateString('bn-BD');

                // ভাইটাল ও লক্ষণ
                let vitalsHTML = "";
                if(rx.vitals?.bp) vitalsHTML += `<p>• রক্তচাপ: ${rx.vitals.bp}</p>`;
                if(rx.vitals?.wt) vitalsHTML += `<p>• ওজন: ${rx.vitals.wt}</p>`;
                document.getElementById('pVitals').innerHTML = vitalsHTML || "কোনো তথ্য নেই";

                // টেস্ট
                document.getElementById('pTests').innerHTML = (rx.tests || []).map(t => `<p>• ${t}</p>`).join('');

                // ওষুধসমূহ
                document.getElementById('pMedicines').innerHTML = rx.medicines.map((m, i) => `
                    <div class="flex items-start gap-4">
                        <span class="text-sm font-bold text-slate-300 mt-1">${i+1}.</span>
                        <div>
                            <p class="text-xl font-black text-slate-900 leading-none">${m.name} <span class="text-xs text-blue-600 font-normal">${m.strength || ''}</span></p>
                            <p class="text-[11px] font-bold text-slate-500 mt-2 italic">${m.dose} --- ${m.time} --- ${m.duration}</p>
                        </div>
                    </div>
                `).join('');

                // উপদেশ
                document.getElementById('pAdvice').innerText = rx.advice || "চিকিৎসকের পরামর্শ মেনে চলুন।";

                // অটোমেটিক প্রিন্ট ডায়ালগ ওপেন (ঐচ্ছিক)
                // setTimeout(() => { window.print(); }, 1000);

            } catch (e) {
                console.error(e);
                alert("ডাটা লোড করতে সমস্যা হয়েছে!");
            }
        }

        loadPrescription();
    </script>
</body>
</html>
