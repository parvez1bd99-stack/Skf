<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পুরাতন রেকর্ড - SmartConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .record-card { transition: all 0.2s; border: 1px solid #f1f5f9; }
        .record-card:hover { border-color: #6366f1; background-color: #f5f3ff; }
    </style>
</head>
<body class="pb-10">

    <!-- হেডার -->
    <header class="bg-white border-b sticky top-0 z-50 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-slate-400 font-bold text-xl">←</button>
            <div>
                <h1 class="text-sm font-black text-slate-800 uppercase tracking-tight">পুরাতন রোগী রেকর্ড</h1>
                <p class="text-[9px] text-indigo-600 font-bold uppercase tracking-widest">সার্চ ও কুইক সিরিয়াল</p>
            </div>
        </div>
        <div id="recordCount" class="text-[10px] font-bold bg-slate-100 px-3 py-1 rounded-full uppercase">০ জন</div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- সার্চ বার -->
        <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-white mb-6">
            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">রোগীর নাম বা মোবাইল নম্বর</label>
            <div class="flex gap-2 mt-2">
                <input type="text" id="searchInput" oninput="searchRecords()" placeholder="যেমন: ০১৭xxxxxxxx..." class="flex-1 bg-slate-50 p-4 rounded-2xl text-sm font-bold outline-none border-none ring-1 ring-slate-100 focus:ring-indigo-500 transition-all">
            </div>
        </div>

        <!-- রেজাল্ট লিস্ট -->
        <div id="resultsList" class="space-y-3">
            <div class="text-center py-20 text-slate-300 italic text-sm">উপরে সার্চ বক্সে তথ্য দিয়ে খুঁজুন...</div>
        </div>
    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs, addDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('docId');
        let allPatients = [];

        // ১. শুরুতে ডাটা লোড করা (সার্চিং ফাস্ট করার জন্য)
        async function loadAllPatients() {
            if (!docId) return;
            try {
                const q = query(collection(db, "patient_queue"), where("doctorId", "==", docId));
                const snap = await getDocs(q);
                
                // ইউনিক পেশেন্ট লিস্ট তৈরি (একই রোগী বারবার থাকতে পারে)
                const uniqueMap = new Map();
                snap.forEach(d => {
                    const p = d.data();
                    const key = p.phone + p.name;
                    if(!uniqueMap.has(key)) {
                        uniqueMap.set(key, { ...p, originalId: d.id });
                    }
                });
                
                allPatients = Array.from(uniqueMap.values());
                document.getElementById('recordCount').innerText = allPatients.length + " জন";
            } catch (e) { console.error(e); }
        }

        // ২. রিয়েল টাইম ফিল্টার/সার্চ
        window.searchRecords = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const listArea = document.getElementById('resultsList');
            
            if (term.length < 3) {
                listArea.innerHTML = '<div class="text-center py-20 text-slate-300 italic text-sm">খুঁজতে কমপক্ষে ৩টি অক্ষর টাইপ করুন...</div>';
                return;
            }

            const filtered = allPatients.filter(p => 
                p.name.toLowerCase().includes(term) || 
                p.phone.includes(term)
            );

            if(filtered.length === 0) {
                listArea.innerHTML = '<div class="bg-white p-10 rounded-[2.5rem] text-center text-slate-400 italic text-xs">কোনো তথ্য পাওয়া যায়নি!</div>';
                return;
            }

            listArea.innerHTML = filtered.map(p => `
                <div class="record-card bg-white p-5 rounded-[2.5rem] shadow-sm flex flex-col gap-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-sm font-black text-slate-800">${p.name}</h4>
                            <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase">${p.phone} | বয়ষ: ${p.age} | ${p.gender}</p>
                        </div>
                        <span class="bg-indigo-50 text-indigo-600 text-[8px] font-black px-2 py-1 rounded-full uppercase">পুরাতন রোগী</span>
                    </div>
                    
                    <div class="flex gap-2 border-t border-slate-50 pt-4">
                        <button onclick="addToSerial('${p.name}', '${p.age}', '${p.gender}', '${p.phone}')" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-[10px] uppercase shadow-lg shadow-indigo-100 active:scale-95 transition">
                            আজকের সিরিয়ালে দিন
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ৩. এক ক্লিকে সিরিয়ালে যোগ করা
        window.addToSerial = async (name, age, gender, phone) => {
            if(!confirm(name + "-কে আজকের সিরিয়ালে যুক্ত করবেন?")) return;

            try {
                await addDoc(collection(db, "patient_queue"), {
                    doctorId: docId,
                    name: name,
                    age: age,
                    gender: gender,
                    phone: phone,
                    status: "waiting",
                    payment: "unpaid",
                    timestamp: serverTimestamp()
                });
                alert("সাফল্যের সাথে সিরিয়ালে যুক্ত করা হয়েছে!");
                window.location.href = `assistant-queue.html?docId=${docId}`;
            } catch (e) {
                alert("ত্রুটি: সিরিয়াল যোগ করা যায়নি।");
            }
        };

        loadAllPatients();
    </script>
</body>
</html>
