<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartConnect - SK+F Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .skf-gradient {
            background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%);
        }
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:active { transform: scale(0.95); }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-md w-full fade-in">
        <!-- ব্র্যান্ডিং এরিয়া -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-white rounded-3xl shadow-xl mb-4 border-b-4 border-blue-600">
                <h1 class="text-4xl font-black text-blue-800 tracking-tighter italic">SK+F</h1>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">SmartConnect</h2>
            <p class="text-[10px] text-blue-500 font-bold uppercase tracking-[0.3em] mt-1">Digital Healthcare System</p>
        </div>

        <div class="glass-card rounded-[2.5rem] shadow-2xl overflow-hidden border border-white">
            
            <!-- ট্যাব সুইচ (স্ক্যান বনাম ম্যানুয়াল) -->
            <div class="flex border-b border-slate-100">
                <button onclick="switchTab('scan')" id="tabScan" class="flex-1 py-4 text-xs font-black uppercase tracking-widest tab-active">Scan Card</button>
                <button onclick="switchTab('manual')" id="tabManual" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-slate-400">Manual Login</button>
            </div>

            <div class="p-8">
                <!-- স্ক্যান সেকশন -->
                <div id="scanSection" class="block">
                    <div class="mb-6">
                        <a href="qr-scanner.html" class="btn-hover block relative group">
                            <div class="skf-gradient p-1 rounded-3xl shadow-lg shadow-blue-200">
                                <div class="bg-white/10 p-6 rounded-[1.4rem] border border-white/20 flex items-center justify-between text-white">
                                    <div class="flex items-center gap-4">
                                        <span class="text-4xl">📸</span>
                                        <div>
                                            <p class="text-lg font-bold leading-none">কার্ড স্ক্যান করুন</p>
                                            <p class="text-[9px] text-blue-100 uppercase mt-1 tracking-widest">দ্রুত লগইন করার জন্য</p>
                                        </div>
                                    </div>
                                    <span class="text-2xl opacity-50">→</span>
                                </div>
                            </div>
                        </a>
                    </div>
                    <p class="text-center text-[10px] text-slate-400 font-bold uppercase">আইডি কার্ডটি ক্যামেরার সামনে ধরুন</p>
                </div>

                <!-- ম্যানুয়াল লগইন সেকশন -->
                <div id="manualSection" class="hidden">
                    <form id="loginForm" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-slate-500 font-bold text-[10px] uppercase ml-2">আপনি কে? (Select Role)</label>
                            <select id="userRole" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 text-sm font-bold text-slate-700 transition">
                                <option value="mso">অফিসার (MSO / Admin)</option>
                                <option value="doctor">ডাক্তার (Doctor)</option>
                                <option value="assistant">অ্যাসিস্ট্যান্ট (Assistant)</option>
                                <option value="chemist">ফার্মেসি (Chemist)</option>
                            </select>
                        </div>

                        <div class="space-y-1">
                            <label class="text-slate-500 font-bold text-[10px] uppercase ml-2">ইউজার আইডি / ফোন</label>
                            <input type="text" id="userId" placeholder="আপনার আইডি লিখুন" required 
                                class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none transition text-sm font-semibold">
                        </div>

                        <div class="space-y-1">
                            <label class="text-slate-500 font-bold text-[10px] uppercase ml-2">পাসওয়ার্ড</label>
                            <input type="password" id="password" placeholder="******" required 
                                class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none transition text-sm font-semibold">
                        </div>

                        <button type="submit" id="loginBtn"
                            class="btn-hover w-full skf-gradient text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 uppercase tracking-[0.2em] text-xs mt-2">
                            লগইন করুন
                        </button>
                    </form>
                </div>

                <div id="message" class="mt-4 text-center text-rose-500 text-[11px] font-bold min-h-[20px] uppercase"></div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">
                SK+F Eskayef Pharmaceuticals | SmartConnect v2.0
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword } from './firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        window.switchTab = (tab) => {
            if(tab === 'scan') {
                document.getElementById('scanSection').classList.remove('hidden');
                document.getElementById('manualSection').classList.add('hidden');
                document.getElementById('tabScan').classList.add('tab-active');
                document.getElementById('tabManual').classList.remove('tab-active');
                document.getElementById('tabManual').classList.add('text-slate-400');
            } else {
                document.getElementById('scanSection').classList.add('hidden');
                document.getElementById('manualSection').classList.remove('hidden');
                document.getElementById('tabManual').classList.add('tab-active');
                document.getElementById('tabManual').classList.remove('text-slate-400');
                document.getElementById('tabScan').classList.remove('tab-active');
                document.getElementById('tabScan').classList.add('text-slate-400');
            }
        }

        const loginForm = document.getElementById('loginForm');
        const msg = document.getElementById('message');
        const btn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('userRole').value;
            const id = document.getElementById('userId').value.trim();
            const pass = document.getElementById('password').value;

            btn.innerText = "যাচাই হচ্ছে..."; btn.disabled = true; msg.innerText = "";

            try {
                if (role === 'mso') {
                    const userCred = await signInWithEmailAndPassword(auth, id, pass);
                    const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
                    if (userDoc.exists()) redirectUser('mso', userCred.user.uid);
                } 
                else if (role === 'doctor') {
                    const q = query(collection(db, "doctors"), where("phone", "==", id), where("password", "==", pass));
                    const snap = await getDocs(q);
                    if (!snap.empty) redirectUser('doctor', snap.docs[0].id);
                    else throw new Error("ভুল আইডি বা পাসওয়ার্ড");
                }
                else {
                    const q = query(collection(db, "users"), where("phone", "==", id), where("password", "==", pass), where("role", "==", role));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const userData = snap.docs[0].data();
                        const targetId = snap.docs[0].id;
                        if(role === 'chemist') redirectUser('chemist', targetId);
                        else redirectUser('assistant', targetId, userData.doctorId);
                    } else throw new Error("ভুল আইডি বা পাসওয়ার্ড");
                }
            } catch (error) {
                msg.innerText = error.message || "লগইন ব্যর্থ হয়েছে!";
                btn.innerText = "লগইন করুন"; btn.disabled = false;
            }
        });

        function redirectUser(role, uid, extraId = null) {
            localStorage.setItem('userRole', role);
            localStorage.setItem('userUid', uid);
            
            if (role === 'mso') window.location.href = 'mso-dashboard.html';
            else if (role === 'doctor') window.location.href = `doctor-dashboard.html?id=${uid}`;
            else if (role === 'chemist') window.location.href = `chemist-dashboard.html?id=${uid}`;
            else if (role === 'assistant') window.location.href = `dactorassistantdashboard.html?docId=${extraId}`;
        }
    </script>
</body>
</html>
