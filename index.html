<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#e3f1e8">
<title>অর্ডার করুন</title>
<style>
:root{--bg:#e3f1e8;--card:#ffffff;--ink:#12261b;--muted:#4a6355;--line:#c3d9ca;--accent:#128c4a;--accent-ink:#ffffff;--on:#e6f5ec;color-scheme:light only;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:1.5rem;margin:8px 0 4px;color:var(--ink)}
p.sub{margin:0 0 16px;color:var(--muted)}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
input[type=search]::placeholder{color:#7a9283}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
li{border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
label.row{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;color:var(--ink)}
label.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.name{flex:1}
.qty{display:none;align-items:center;gap:8px}
li.on .qty{display:flex}
li.on{background:var(--on)}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
.qty span{min-width:20px;text-align:center;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto}
#send{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
#send:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:16px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>প্রোডাক্ট বেছে নিন</h1>
<p class="sub">যেগুলো লাগবে টিক দিন, তারপর হোয়াটসঅ্যাপে পাঠান।</p>
<input type="search" id="q" placeholder="প্রোডাক্ট খুঁজুন" aria-label="প্রোডাক্ট খুঁজুন">
<ul id="list"></ul>
</main>
<div class="bar"><div><button id="send" disabled>হোয়াটসঅ্যাপে পাঠান</button></div></div>
<script>
// ====== এখানে পরিবর্তন করুন ======
var WHATSAPP_NUMBER = "8801347527872"; // দেশের কোডসহ, + ছাড়া (বাংলাদেশ: 880 + নম্বর)
var PRODUCTS = [
// Cardiac - ছবি ১
"Tems 20 mg","Tems 40 mg","Tems 80 mg",
"Tems A 40/5","Tems A 80/5",
"Tems Plus 40/12.5","Tems Plus 80/12.5",
"Cardobis 1.25 mg","Cardobis 2.5 mg","Cardobis 5 mg",
"Cardobis M 2.5/5","Cardobis M 5/5",
"Cardobis Plus 2.5/6.25","Cardobis Plus 5/6.25",
"Olmesta 10 mg","Olmesta 20 mg","Olmesta 40 mg",
"Olmesta M 20/5","Olmesta M 40/5",
"Olmesta Plus 20/12.5",
"Amlevo 2.5 mg","Amlevo 5 mg",
"Cilny 5 mg","Cilny 10 mg",
"Sympres 0.2 mg","Sympres 0.3 mg",
// Cardiac - ছবি ২
"Arnis 50","Arnis 100",
"Rivarox 2.5 mg","Rivarox 10 mg","Rivarox 15 mg","Rivarox 20 mg",
"GTN 2.6 SR",
"Noclog 75 mg",
"Cardimet MR 35 mg",
"Tolvan 15 mg",
"Enorin 40 mg","Enorin 60 mg","Enorin 80 mg",
"NoPlag 60 mg","NoPlag 90 mg",
"Dezide 50/25",
"Edenil",
"Sentix 0.5 mg","Sentix 1 mg",
"Sidopin 5 mg",
// Antidiabetic - ছবি ৩
"Emazid 10 mg","Emazid 25 mg",
"Emazid L 10/5","Emazid L 25/5",
"Emazid M 5/500","Emazid M 12.5/500",
"Ligazid 5 mg",
"Ligazid M 2.5/500","Ligazid M 2.5/850","Ligazid M 2.5/1000",
"Vigamet 50/500","Vigamet 50/800",
"Glikazid 30 mg","Glikazid 60 mg","Glikazid 80 mg",
"Glunor 500 mg","Glunor 850 mg","Glunor 500 mg XR",
"Sitazid M 50/500",
"Insumin 500 mg",
  " piozid 15mg",
  "Tenazid 20mg",
  " Tenalase 50mg injection",
"exoren 1.25mg","exoren 2.5mg","exoren 5mg",
"Zepter 2.5 mg","Zepter 5 mg","Zepter 7.5 mg",
"Aldorin 50 mg","Cifibet 100mg","surliv 150mg","surliv300mg","Duoliv 5mg","Duoliv 10mg","resmit 80mg","resmit 100mg","oroxat 20mg","oroxat 50mg","oroxat 100mg","hemocrit 3000 inj","hemocrit 5000 inj","hemocrit 2000inj","Dephos 500mg","Depfalix 65 inj","Renfit 10mg","Renfit 20mg","Fericit 210mg","Vincet 5mg","creston 10mg","lipicon 10mg","cardon 50mg"
];
// =================================
// নামের আগে-পরের বাড়তি ফাঁকা মুছে দেয়
PRODUCTS = PRODUCTS.map(function(p){return p.trim()});

var sel = {};
var KEY = "order_selection_v1";
var list = document.getElementById("list"), q = document.getElementById("q"), send = document.getElementById("send");
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}

// সেভ: প্রোডাক্টের নাম ধরে রাখা হয়, তাই লিস্ট বদলালেও সমস্যা নেই
function save(){
  try{
    var o = {};
    PRODUCTS.forEach(function(p,i){ if(sel[i]>0) o[p]=sel[i]; });
    if(Object.keys(o).length) localStorage.setItem(KEY, JSON.stringify(o));
    else localStorage.removeItem(KEY);
  }catch(e){}
}
function load(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || "{}");
    PRODUCTS.forEach(function(p,i){ if(o[p]>0) sel[i]=o[p]; });
  }catch(e){}
}

function render(){
  var t = q.value.trim().toLowerCase(), html = "";
  PRODUCTS.forEach(function(p,i){
    if(t && p.toLowerCase().indexOf(t)<0) return;
    var on = sel[i]>0;
    html += '<li class="'+(on?'on':'')+'"><label class="row"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'><span class="name">'+p+'</span>'+
      '<span class="qty"><button type="button" data-m="'+i+'" aria-label="কমান">−</button><span>'+bn(sel[i]||0)+'</span><button type="button" data-p="'+i+'" aria-label="বাড়ান">+</button></span></label></li>';
  });
  list.innerHTML = html || '<li class="empty">কিছু পাওয়া যায়নি</li>';
  var n = Object.keys(sel).filter(function(k){return sel[k]>0}).length;
  send.disabled = n===0;
  send.textContent = n ? "হোয়াটসঅ্যাপে পাঠান ("+bn(n)+"টি প্রোডাক্ট)" : "হোয়াটসঅ্যাপে পাঠান";
  save();
}
list.addEventListener("click",function(e){
  var b = e.target.closest("button"); if(!b) return;
  e.preventDefault();
  if(b.dataset.p!==undefined) sel[b.dataset.p]=(sel[b.dataset.p]||0)+1;
  if(b.dataset.m!==undefined){var k=b.dataset.m; sel[k]=Math.max(1,(sel[k]||1)-1);}
  render();
});
list.addEventListener("change",function(e){
  var i = e.target.dataset.i; if(i===undefined) return;
  if(e.target.checked) sel[i]=1; else delete sel[i];
  render();
});
q.addEventListener("input",render);
send.addEventListener("click",function(){
  var lines = ["আসসালামু আলাইকুম, আমি নিচের প্রোডাক্টগুলো অর্ডার করতে চাই:",""];
  var c = 0;
  PRODUCTS.forEach(function(p,i){ if(sel[i]>0){ c++; lines.push(bn(c)+". "+p+" — "+bn(sel[i])+" টি"); } });
  var url = "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(lines.join("\n"));
  window.open(url,"_blank");
  // অর্ডার পাঠানো শেষ, তাই সিলেকশন মুছে ফেলা হচ্ছে
  sel = {};
  q.value = "";
  render();
});
load();
render();
</script>
</body>
</html>
