<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<title>কেমিস্ট কর্নার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0f3d2a;--leaf:#128c4a;--mint:#e3f1e8;--paper:#f5faf6;--card:#fff;
  --ink:#12261b;--muted:#4a6355;--line:#c3d9ca;--sun:#d9a441;--sun-soft:#fbf1da;--sun-ink:#7a5a12;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.45;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- Hero (compact) ---------- */
.hero{
  position:relative;flex:none;background:var(--deep);color:#fff;
  padding:calc(env(safe-area-inset-top) + 18px) 20px 40px;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#1d7a4c,rgba(29,122,76,0) 70%);
}
.hero::after{
  content:"";position:absolute;width:200px;height:200px;left:-90px;bottom:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,164,65,.28),rgba(217,164,65,0) 70%);
}
.hero-inner{position:relative;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;animation:rise .6s ease both}
.mark{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center}
.mark svg{width:26px;height:26px}
h1{font-family:"Noto Serif Bengali","Hind Siliguri",serif;font-weight:700;font-size:clamp(1.4rem,5.4vw,1.9rem);line-height:1.25}
.hero p{color:#cfe7d7;font-size:.95rem;margin-top:2px}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:28px;display:block}

/* ---------- Tiles ---------- */
main{
  flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;
  padding:0 14px calc(env(safe-area-inset-bottom) + 14px);
  display:flex;
}
.grid{
  flex:1;min-height:0;width:100%;
  display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:12px;
}
.tile{
  position:relative;min-width:0;min-height:0;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px;text-decoration:none;color:inherit;overflow:hidden;
  box-shadow:0 8px 22px -14px rgba(15,61,42,.4);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent;
}
a.tile:hover{transform:translateY(-3px);border-color:var(--leaf);box-shadow:0 14px 26px -14px rgba(15,61,42,.5)}
a.tile:active{transform:scale(.98)}
a.tile:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.icon{flex:none;width:clamp(40px,7.5vh,56px);aspect-ratio:1;border-radius:16px;background:var(--mint);color:var(--leaf);display:grid;place-items:center}
.icon svg{width:56%;height:56%}
.txt{min-height:0}
.tile h2{font-family:"Noto Serif Bengali","Hind Siliguri",serif;font-size:clamp(.98rem,3.9vw,1.15rem);line-height:1.3}
.tile p{color:var(--muted);font-size:clamp(.78rem,3vw,.9rem);line-height:1.35;margin-top:2px}
.badge{
  position:absolute;top:12px;right:12px;font-size:.74rem;font-weight:500;
  padding:1px 10px;border-radius:99px;background:var(--sun-soft);color:var(--sun-ink);
}

/* highlighted gift tile */
.tile.gift{background:linear-gradient(160deg,#fff 40%,var(--sun-soft));border-color:#ecd49b}
.tile.gift .icon{background:var(--sun-soft);color:#a8760e}
a.tile.gift:hover{border-color:var(--sun)}

/* upcoming tiles */
.tile.soon{background:#fafcfa;border-style:dashed;box-shadow:none;cursor:default}
.tile.soon .icon{background:#eef1ee;color:#7b8a80}
.tile.soon h2{color:#4d5f54}
.tile.more{align-items:center;justify-content:center;text-align:center;color:#8a9a90;font-size:.9rem}
.tile.more svg{width:28px;height:28px;margin-bottom:4px}

/* short phones: hide descriptions so all tiles stay in view */
@media (max-height:640px){
  .tile p{display:none}
  .tile{padding:12px}
}
@media (max-height:560px){
  .hero{padding-bottom:34px}
  .hero p{display:none}
}

/* wider screens */
@media (min-width:700px){
  .hero{padding-bottom:46px}
  main{padding-bottom:20px}
  .tile{padding:18px}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-inner{animation:none}.tile{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 20.5a5 5 0 0 1-7-7l9-9a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>
      </svg>
    </div>
    <div>
      <h1>কেমিস্ট কর্নার</h1>
      <p>অর্ডার, হিসাব আর উপহার এক জায়গায়</p>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1440 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,28 L0,12 C240,28 480,0 760,10 C1040,20 1220,24 1440,8 L1440,28 Z" fill="#f5faf6"/>
  </svg>
</header>

<main>
  <div class="grid">

    <a class="tile" href="order.html">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h13l-1.6 8.2a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.6L5.2 4H3"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="16.5" cy="20" r="1.2"/>
        </svg>
      </div>
      <div class="txt"><h2>অর্ডার করুন</h2><p>প্রোডাক্ট বেছে অর্ডার পাঠান</p></div>
    </a>

    <a class="tile" href="smart-calculator.html">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7"/><path d="M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/>
        </svg>
      </div>
      <div class="txt"><h2>স্মার্ট ক্যালকুলেটর</h2><p>বিক্রয়ের হিসাব ও ক্যাশ মেমো</p></div>
    </a>

    <a class="tile gift" href="gift-offer.html">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/>
          <path d="M12 8c-1-3-2.5-4.5-4.5-4.5a2 2 0 0 0 0 4.5zM12 8c1-3 2.500-4.500 4.500-4.500a2 2 0 0 1 0 4.500z"/>
        </svg>
      </div>
      <div class="txt"><h2>উপহার অফার</h2><p>টার্গেট পূরণে পান উপহার</p></div>
    </a>



<a class="tile" href="pharmacy-management.html">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 9.5L5 4h14l1.5 5.5"/><path d="M3.5 9.5a2.8 2.8 0 0 0 5.5 0 2.8 2.8 0 0 0 6 0 2.8 2.8 0 0 0 5.5 0"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4.5h4V20"/>
        </svg>
      </div>
      <div class="txt"><h2>ফার্মেসি ম্যানেজমেন্ট</h2><p>তাক ও কোম্পানির অর্ডার ট্র্যাকার</p></div>
    </a>

    <!-- নতুন টুল এলে এই ঘরটি ব্যবহার করুন বা মুছে দিন -->
    <div class="tile soon more" aria-hidden="true">
      <div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <div>আরও টুল আসছে</div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
