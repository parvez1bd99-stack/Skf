<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ডিটেইলস - SmartConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="pb-10">

    <!-- হেডার -->
    <div class="bg-slate-900 text-white px-6 py-8 rounded-b-[3rem] shadow-xl mb-6 no-print">
        <div class="flex justify-between items-center">
            <button onclick="history.back()" class="text-blue-400 font-bold flex items-center">← ফিরে যান</button>
            <h1 class="text-lg font-black italic">অর্ডার বিবরণ</h1>
            <button onclick="window.print()" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">প্রিন্ট</button>
        </div>
    </div>

    <div class="px-4 max-w-md mx-auto">
        <!-- দোকানদার ও অর্ডার তথ্য -->
        <div class="bg-white rounded-[2rem] p-6 shadow-sm mb-6 border border-white">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl">🏪</div>
                <div>
                    <h2 id="detChemistName" class="text-lg font-black text-slate-800 leading-none">লোড হচ্ছে...</h2>
                    <p id="detOrderDate" class="text-[10px] text-gray-400 font-bold uppercase mt-1 tracking-widest"></p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-50 text-center">
                <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase">অর্ডার আইডি</p>
                    <p id="detOrderId" class="text-xs font-black text-slate-700"></p>
                </div>
                <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase">মোট টাকার পরিমাণ</p>
                    <p id="detTotalAmount" class="text-xs font-black text-blue-600"></p>
                </div>
            </div>
        </div>

        <!-- আইটেম লিস্ট -->
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-3 ml-2">অর্ডার করা আইটেমসমূহ</h3>
        <div class="bg-white rounded-[2rem] shadow-sm overflow-hidden border border-white">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase">
                    <tr>
                        <th class="px-4 py-3">আইটেম (ওষুধ)</th>
                        <th class="px-4 py-3 text-center">পরিমাণ</th>
                        <th class="px-4 py-3 text-right">মূল্য</th>
                    </tr>
                </thead>
                <tbody id="detItemsTable" class="divide-y divide-gray-50">
                    <tr><td colspan="3" class="p-10 text-center text-gray-300 italic text-xs">ডাটা লোড হচ্ছে...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- স্ট্যাটাস আপডেট (MSO এর জন্য) -->
        <div class="mt-8 no-print">
            <p class="text-[10px] text-gray-400 font-bold uppercase mb-2 ml-2">অর্ডার স্ট্যাটাস আপডেট করুন</p>
            <div class="flex gap-2">
                <button onclick="updateStatus('Processing')" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-lg">প্রসেসিং</button>
                <button onclick="updateStatus('Delivered')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-lg">ডেলিভারড</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('mso');

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function loadOrderDetails() {
            if (!orderId) return;

            try {
                const orderSnap = await getDoc(doc(db, "orders", orderId));
                if (!orderSnap.exists()) return;

                const order = orderSnap.data();
                
                const chemistSnap = await getDoc(doc(db, "users", order.chemistId));
                const chemistName = chemistSnap.exists() ? chemistSnap.data().name : "অচেনা ফার্মেসি";

                document.getElementById('detChemistName').innerText = chemistName;
                document.getElementById('detOrderId').innerText = "#" + orderId.slice(0, 8).toUpperCase();
                document.getElementById('detTotalAmount').innerText = "৳ " + order.totalAmount.toLocaleString('bn-BD');
                document.getElementById('detOrderDate').innerText = order.timestamp ? order.timestamp.toDate().toLocaleString('bn-BD') : "---";

                const tableBody = document.getElementById('detItemsTable');
                tableBody.innerHTML = "";

                order.items.forEach(item => {
                    tableBody.innerHTML += `
                        <tr class="text-sm">
                            <td class="px-4 py-4">
                                <p class="font-black text-slate-700 leading-tight">${item.name} <span class="text-blue-600">${item.strength || ''}</span></p>
                                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">মূল্য: ৳${item.price}</p>
                            </td>
                            <td class="px-4 py-4 text-center font-black text-indigo-600">${item.qty} পিস</td>
                            <td class="px-4 py-4 text-right font-bold text-slate-600">৳ ${item.price * item.qty}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error(error);
            }
        }

        window.updateStatus = async (newStatus) => {
            if(confirm(`অর্ডারটি কি ${newStatus} করতে চান?`)) {
                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
                alert("স্ট্যাটাস পরিবর্তন সফল হয়েছে!");
                location.reload();
            }
        }

        loadOrderDetails();
    </script>
</body>
</html>
